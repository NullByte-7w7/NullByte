<div id="boot-screen">
    <div id="boot-log"></div>
</div>

<style>
    #boot-screen {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: #000;
        color: #fff;
        font-family: "Courier New", monospace;
        padding: 20px;
        z-index: 20000;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .log-malware { color: #e310a3; font-weight: bold; }
    .log-entry { margin-bottom: 2px; font-size: 14px; }
    .log-success { color: #00ff00; }
    .log-error { color: #ff3e3e; font-weight: bold; }
    .log-warning { color: #ffcc00; }

    /* Esconder o desktop enquanto carrega */
    #desktop, #taskbar { visibility: hidden; }
</style>
<script>
    const logContainer = document.getElementById('boot-log');

    const bootSequence = [
        { t: "[  0.000000] Linux version 5.15.0-76-generic (nullbyte@terminal)", type: "info" },
        { t: "[  0.124512] Command line: BOOT_IMAGE=/vmlinuz-5.15 root=UUID=x0539 ro quiet splash", type: "info" },
        { t: "[  0.456123] x86/fpu: Supporting XSAVE feature set: 0x01f", type: "info" },
        { t: "[  1.102341] Initializing cgroup subsys cpuset", type: "info" },
        { t: "[  1.567822] pci 0000:00:01.0: [8086:1901] type 00 class 0x060400", type: "info" },
        { t: "[  2.120098] SCSI subsystem initialized", type: "info" },
        { t: "[  2.890112] usbcore: registered new interface driver usbfs", type: "info" },
        { t: "[  3.456122] Mounting root filesystem...", type: "info" },
        { t: "[  3.890123] EXT4-fs (sda1): mounted filesystem with ordered data mode.", type: "success" },
        { t: "[  4.210982] Checking for security modules...", type: "warning" },
        { t: "[  4.500121] ALERT: EDR NOT FOUND - SYSTEM VULNERABLE", type: "error" },
        { t: "[  5.102933] Initializing network interfaces: eth0 up", type: "success" },
        { t: "[  5.678122] Loading custom kernel modules...", type: "info" },
        { t: "[  6.102394] INSMOD: nullbyte0x0539.ko ...", type: "info" },
        { t: "[  7.234122] nullbyte0x0539.ko: ko loading with success!", type: "malware" },
        { t: "[  7.890123] nullbyte0x0539.ko: Hiding processes and hooks initialized.", type: "malware" },
        { t: "[  8.500000] Starting Graphical Interface...", type: "info" }
    ];

    let i = 0;
    function runBoot() {
        if (i < bootSequence.length) {
            const entry = document.createElement('div');
            entry.className = 'log-entry'; // Classe base

            if (bootSequence[i].type === 'malware') entry.className += ' log-malware';
            if (bootSequence[i].type === 'error')   entry.className += ' log-error';
            if (bootSequence[i].type === 'success') entry.className += ' log-success';
            if (bootSequence[i].type === 'warning') entry.className += ' log-warning';

            entry.innerText = bootSequence[i].t;
            logContainer.appendChild(entry);

            window.scrollTo(0, document.body.scrollHeight);

            let delay = Math.random() * 200 + 50;
            if (bootSequence[i].type === 'error' || bootSequence[i].type === 'malware') {
                delay = 800;
            }

            i++;
            setTimeout(runBoot, delay);
        } else {
            setTimeout(() => {
                const bootScreen = document.getElementById('boot-screen');
                const desktop = document.getElementById('desktop');
                const taskbar = document.getElementById('taskbar');

                if(bootScreen) bootScreen.style.display = 'none';
                if(desktop) desktop.style.visibility = 'visible';
                if(taskbar) taskbar.style.visibility = 'visible';
            }, 1000);
		setTimeout(() => {
                window.location.href = "home.html";
            }, 1500);
        }
    }

    window.onload = runBoot;
</script>
